<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <h1>Task Tracker Kuliah</h1>

    <form id="form-tugas">
      <input type="text" id="judul" placeholder="Judul tugas (min. 3 karakter)">
      <div class="baris">
        <select id="matkul">
          <option>Pemrograman Web</option>
          <option>Keamanan Jaringan Komputer</option>
          <option>Komdat Jaringan Komputer</option>
          <option>Internet of Things</option>
          <option>Ethical Hacking</option>
          <option>Komunikasi Profesional</option>
        </select>
        <input type="date" id="deadline">
        <button type="submit" class="tambah">Tambah</button>
      </div>
      <p id="error" class="error"></p>
    </form>

    <div class="bar">
      <div class="filter">
        <button class="on" data-filter="semua">Semua</button>
        <button data-filter="aktif">Aktif</button>
        <button data-filter="selesai">Selesai</button>
      </div>
      <span id="counter"></span>
    </div>

    <ul id="daftar"></ul>
    <p id="kosong"></p>
  </div>
</body>
</html>
